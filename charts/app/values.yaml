replicaCount: 1

# Deployment or StatefulSet
workload:
  kind: Deployment

appType: ""

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: dockerconfigjson
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

env: []
# Secret loaded with envFrom. Empty skips it.
secretName: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}

service:
  type: ClusterIP
  externalPort: 80
  internalPort: 8000
  extraPorts: []
    # - name: metrics
    #   containerPort: 9273

ingress:
  enabled: true
  ingressClassName: nginx
  annotations: {}
  hosts: []
    # - id: route-id
    #   host: app.example.com
    #   path: /
    #   visibility: public
    #   ssoRequired: false
    #   ingressClassName: nginx
    #   annotations: {}
    #   tls:
    #     enabled: false
    #     secretName: app.example.com-tls

resources: {}

networkPolicy:
  enabled: false
  ingress:
    enabled: true
    namespaceSelector:
      kubernetes.io/metadata.name: lowops-core
    podSelector: {}
  egress:
    postgresql:
      enabled: true
      port: 5432
      namespaceSelector: {}
      podSelector: {}
    s3Gateway:
      enabled: true
      port: 9000
      namespaceSelector:
        kubernetes.io/metadata.name: lowops-data
      podSelector:
        app.kubernetes.io/component: s3-gateway-apps
    tempo:
      enabled: true
      grpcPort: 4317
      httpPort: 4318
      namespaceSelector:
        kubernetes.io/metadata.name: lowops-monitoring
      podSelector:
        app.kubernetes.io/name: opentelemetry-collector
    external:
      enabled: true
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: UDP
          port: 53
      exceptCIDRs: []
    custom: []

startupProbe: {}
  # path: /
  # failureThreshold: 1080
  # periodSeconds: 10

readinessProbe:
  path: /
  periodSeconds: 10
  failureThreshold: 3
  successThreshold: 1

livenessProbe:
  path: /
  periodSeconds: 10
  failureThreshold: 3

lifecycle:
  preStop:
    enabled: false
    command: /opt/eap/bin/stop.sh

persistence:
  enabled: false
  mountPath: ""
  extraVolumes: []
  extraVolumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
